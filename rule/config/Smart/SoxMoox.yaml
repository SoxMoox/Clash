    url: 'https://www.gstatic.com/generate_204'
    include-all: true
    exclude-type: direct
    interval: 180
    tolerance: 30
    filter: "(?i)^(?!.*(中国直连|官网|剩余|到期|异常|失败|GB|date|reset|0.5|体验|试用|临时|测试|重置|时间|日期)).*"

